<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Nakul Boys Hostel</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


<div class="login-box">

    <h1>Nakul Boys Hostel</h1>

    <p class="login-title">
        Admin Login
    </p>


    <form id="loginForm">

        <label>
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            class="primary-btn">

            Login

        </button>


        <p id="loginMessage"></p>

    </form>


    <a href="index.html">
        ← Back to Website
    </a>

</div>


<script src="js/script.js"></script>

</body>

</html>
