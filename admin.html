<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Nakul Boys Hostel</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<nav class="admin-navbar">

    <div class="logo">
        Nakul Boys Hostel
    </div>

    <a href="index.html">
        Logout
    </a>

</nav>

</header>


<section class="dashboard">


    <h1>Admin Dashboard</h1>

    <p>
        Hostel management overview
    </p>


    <div class="dashboard-cards">


        <div class="dashboard-card">

            <span>🏠</span>

            <h3>Total Rooms</h3>

            <strong>25</strong>

        </div>


        <div class="dashboard-card">

            <span>👨‍🎓</span>

            <h3>Total Students</h3>

            <strong>40</strong>

        </div>


        <div class="dashboard-card">

            <span>🛏️</span>

            <h3>Available Beds</h3>

            <strong>5</strong>

        </div>


        <div class="dashboard-card">

            <span>💰</span>

            <h3>Pending Fees</h3>

            <strong>7</strong>

        </div>


    </div>


    <div class="admin-section">

        <h2>Quick Actions</h2>


        <div class="admin-actions">

            <button>
                Add Student
            </button>

            <button>
                Manage Rooms
            </button>

            <button>
                View Students
            </button>

            <button>
                Payment Records
            </button>

            <button>
                Fee Reminders
            </button>

        </div>

    </div>


</section>


<script src="script.js"></script>

</body>

</html>
