<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Nakul Boys Hostel</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<nav class="admin-navbar">

    <div class="logo">
        Nakul Boys Hostel
    </div>

    <a href="index.html">
        Logout
    </a>

</nav>

</header>


<section class="dashboard">


    <h1>Admin Dashboard</h1>

    <p>
        Hostel management overview
    </p>


    <div class="dashboard-cards">


        <div class="dashboard-card">

            <span>🏠</span>

            <h3>Total Rooms</h3>

            <strong>25</strong>

        </div>


        <div class="dashboard-card">

            <span>👨‍🎓</span>

            <h3>Total Students</h3>

            <strong>40</strong>

        </div>


        <div class="dashboard-card">

            <span>🛏️</span>

            <h3>Available Beds</h3>

            <strong>5</strong>

        </div>


        <div class="dashboard-card">

            <span>💰</span>

            <h3>Pending Fees</h3>

            <strong>7</strong>

        </div>


    </div>


    <div class="admin-section">

        <h2>Quick Actions</h2>


        <div class="admin-actions">

            <button>
                Add Student
            </button>

            <button>
                Manage Rooms
            </button>

            <button>
                View Students
            </button>

            <button>
                Payment Records
            </button>

            <button>
                Fee Reminders
            </button>

        </div>

    </div>

<!-- Notice Management -->

<div class="admin-section">

    <h2>Digital Notice Board Management</h2>

    <p>Publish important announcements for hostel residents.</p>

    <div class="notice-form">

        <h3>Publish New Notice</h3>

        <form id="noticeForm">

            <label for="noticeTitle">Notice Title</label>
            <input
                type="text"
                id="noticeTitle"
                placeholder="Enter notice title"
                required
            >

            <label for="noticeCategory">Category</label>
            <select id="noticeCategory" required>
                <option value="">Select Category</option>
                <option value="General">General</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Events">Events</option>
                <option value="Important">Important</option>
            </select>

            <label for="noticeDescription">Description</label>
            <textarea
                id="noticeDescription"
                placeholder="Write your announcement..."
                rows="4"
                required
            ></textarea>

            <button type="submit">Publish Notice</button>

        </form>

    </div>

    <div class="admin-notice-list">

        <h3>Published Notices</h3>

        <div id="adminNoticeList">
            <!-- Notices will appear here using JavaScript -->
        </div>

    </div>

</div>


</section>


<script src="script.js"></script>

</body>

</html>
